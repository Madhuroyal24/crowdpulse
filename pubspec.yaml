name: crowdpulse
description: "CrowdPulse - AI-powered smart queue and crowd prediction application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core & Backend Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.0.1
  firebase_crashlytics: ^4.0.1
  
  # State Management & Navigation
  provider: ^6.1.2
  go_router: ^14.0.0
  
  # UI, Maps & Visualizations
  google_maps_flutter: ^2.6.1
  fl_chart: ^0.68.0
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  
  # Location & Device Utilities
  geolocator: ^12.0.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
